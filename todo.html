<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="todoJS.js"></script>
    <link rel="stylesheet" href="todo_styles.css">
</head>
<body>
    <div class="navbar">
        <nav>
            <a href="todo.html" id="home-navbutton">Home</a>
            <a href="#" id="about-navbutton">About</a>
            <a href = "#" id="contact-navbutton">Contact</a>
        </nav>
    </div>

    <h1 id="opening-header">Please Enter an Expense into the Slots below</h1>
    <form id="expense-form">
        <input id="expense-name" type="text" placeholder="Expense Name..."/>
        <input id="expense-amount" type="number" placeholder="Expense Amount ($)"/>
        <select id="expense-type" required>
            <option value="" disabled selected>Select Catagory</option>
            <option value="Food">Food</option>
            <option value="Transport/Car">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>
        <input type="date" id="expense-date" required/>
    </form>
    <button id="task-submitbutton" onclick="buttonpressed();">Enter</button>
    <table class="expense-table" id="table-expenses">
        <tr id="table-heads">
            <th>Expense|</th>
            <th>Expense Amount|</th>
            <th>Expense Type|</th>
            <th>Date|</th>
            <th>Action|</th>
        </tr>
    </table>
    
    <footer id="running-total">Total: </footer>
    

    
</body>
</html>
